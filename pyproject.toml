[project]
name = "league-table"
version = "0.1.0"
description = "Calculate football league standings tables from CSV match results."
requires-python = ">=3.10"

[project.scripts]
league-table = "league_table.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["league_table*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
